services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: scanner
    volumes:
      - portglass_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 10s
      timeout: 5s
      retries: 10

  portglass:
    image: ${PORTGLASS_IMAGE:?set PORTGLASS_IMAGE}
    restart: unless-stopped
    # Memory ceiling for the app + scanner subprocess. RAM is capped at
    # mem_limit; memswap_limit allows a bounded amount of swap ABOVE that so
    # short memory spikes get absorbed instead of hard-killing Node (with swap
    # fully disabled, Node 24 sized its heap from the cgroup to ~768MB and
    # OOM-crashed on spikes). The swap is bounded, so the container still can't
    # drag the whole box into runaway swap-thrash. Override via PORTGLASS_MEM /
    # PORTGLASS_MEMSWAP.
    mem_limit: ${PORTGLASS_MEM:-1536m}
    memswap_limit: ${PORTGLASS_MEMSWAP:-3072m}
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:51111:51111"
    environment:
      PORT: 51111
      PUBLIC_PORT: 51111
      # Use the pre-URL-encoded DATABASE_URL from .env. Do NOT build it from the
      # raw POSTGRES_PASSWORD here: that password contains a '/', which yields a
      # "TypeError: Invalid URL" at boot (pg can't parse the unescaped slash).
      DATABASE_URL: ${DATABASE_URL:?set pre-URL-encoded DATABASE_URL in .env}
      BASE_URL: ${BASE_URL:-https://twDYSCAN.YHW.EDU.PL}
      AUTHENTIK_ISSUER_BASE_URL: ${AUTHENTIK_ISSUER_BASE_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?set long random session secret}
      # Public Mapbox token (pk.*) for the host-location map. Read at runtime so
      # it never has to be committed to the repo.
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      # Max scans running at once; the rest queue. Keep low on this small host.
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-2}
      # Give V8 an explicit heap ceiling (~1GB) instead of letting it auto-size
      # from the cgroup (which landed at ~768MB and OOM-crashed under load). Sits
      # comfortably inside mem_limit + swap.
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=1024}

volumes:
  portglass_pg:
