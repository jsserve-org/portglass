services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: scanner
    volumes:
      - portglass_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 10s
      timeout: 5s
      retries: 10

  portglass:
    image: ${PORTGLASS_IMAGE:?set PORTGLASS_IMAGE}
    restart: unless-stopped
    # Hard memory ceiling: the app and the scanner subprocess share this
    # container, so this caps their combined footprint. On a small host shared
    # with other services it guarantees a heavy scan can only OOM (and restart)
    # Portglass itself, never the rest of the box. memswap_limit == mem_limit
    # disables swap for the container, so it OOM-restarts cleanly instead of
    # dragging the whole box into swap-thrash. Override with PORTGLASS_MEM.
    mem_limit: ${PORTGLASS_MEM:-1536m}
    memswap_limit: ${PORTGLASS_MEM:-1536m}
    mem_reservation: 256m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:51111:51111"
    environment:
      PORT: 51111
      PUBLIC_PORT: 51111
      # Use the pre-URL-encoded DATABASE_URL from .env. Do NOT build it from the
      # raw POSTGRES_PASSWORD here: that password contains a '/', which yields a
      # "TypeError: Invalid URL" at boot (pg can't parse the unescaped slash).
      DATABASE_URL: ${DATABASE_URL:?set pre-URL-encoded DATABASE_URL in .env}
      BASE_URL: ${BASE_URL:-https://twDYSCAN.YHW.EDU.PL}
      AUTHENTIK_ISSUER_BASE_URL: ${AUTHENTIK_ISSUER_BASE_URL:-}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:-}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?set long random session secret}
      # Max scans running at once; the rest queue. Keep low on this small host.
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-2}

volumes:
  portglass_pg:
